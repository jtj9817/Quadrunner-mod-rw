<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The Combatdog's retreat siren: a yellow lamp with a soft edge, drawn over the dog while it flashes. -->
  <defs>
    <radialGradient id="lamp" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.35" stop-color="#ffd21a"/>
      <stop offset="0.6" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#lamp)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#7a5200" stroke-opacity="0.6" stroke-width="2"/>
</svg>
